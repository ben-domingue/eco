project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
  resources:
    - specimen.js
    - map.js
    - llms.txt
    - wheels/**/*.whl     # the browser validator's wheel, built by prerender.R (#8)
    # Logo kit (logos/README.md). The app icons are named only in
    # site.webmanifest and the other variants by no page, so resource discovery
    # would not copy them. logos/reference/ (test renders, build scripts) is
    # deliberately left out.
    - logos/*.svg
    - logos/*.png
    - logos/*.ico
    - site.webmanifest
  # Writes data/site_stats.json from the pipeline's staging files so the
  # homepage counts cannot disagree with the tables (untracked, see ../.gitignore).
  pre-render:
    - Rscript prerender.R
  # One page per table under _site/tables/ (schema.org JSON-LD + EML), the A-Z
  # index, and the table URLs appended to sitemap.xml (#13; landing/README.md).
  post-render:
    - Rscript landing/emit_landing_pages.R
  preview:
    port: 4300

website:
  title: "eco"
  # GitHub Pages project site. The custom-domain step is a one-line change
  # here plus a CNAME file if that ever happens.
  site-url: https://ben-domingue.github.io/eco/
  # GA4 property "eco" (separate from IRW's). Search Console verifies the
  # URL-prefix property https://ben-domingue.github.io/eco/ through this tag;
  # if the site moves to its own domain, keep this ID and add a Domain property.
  google-analytics: G-H94NN0RR8L
  repo-url: https://github.com/ben-domingue/eco
  repo-actions: [issue]
  description: "Ecological detection data in one format: occupancy surveys, repeated counts and capture histories from public deposits, validated and versioned."
  favicon: logos/favicon.ico
  # Social-sharing cards. Absolute URL: a relative one resolves against each
  # page, so pages in vignettes/ would point at vignettes/logos/.
  open-graph:
    image: https://ben-domingue.github.io/eco/logos/og-image.png
    image-width: 1200
    image-height: 630
  twitter-card:
    card-style: summary_large_image
    image: https://ben-domingue.github.io/eco/logos/og-image.png
    image-width: 1200
    image-height: 630
  navbar:
    # The dark lockup carries the name, so the text title is hidden; logo-alt
    # keeps it for screen readers. Sized in custom.scss (.navbar-logo).
    title: false
    logo: logos/eco-lockup-dark.svg
    logo-alt: "eco"
    search: true
    left:
      - text: Data
        menu:
          - href: data.qmd
            text: Browse the tables
          # Written by the post-render step, not a .qmd (#13).
          - href: tables/index.html
            text: Table pages (A-Z)
          - href: data_notes.qmd
            text: Data notes
          - href: corrections.qmd
            text: Releases and corrections
      - text: Use it
        menu:
          - href: r.qmd
            text: R package
          - href: vignettes/index.qmd
            text: Vignettes
          - href: agents.qmd
            text: Using an AI assistant
          - href: use.qmd
            text: Using eco responsibly
          - href: coarsening.qmd
            text: Coordinate coarsening
      - text: The format
        menu:
          - href: standard.qmd
            text: The standard
          - href: validate.qmd
            text: Check a file
          - href: design.qmd
            text: Design decisions
          - href: contribute.qmd
            text: Converting a deposit
          - href: glossary.qmd
            text: Glossary
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/ben-domingue/eco
        aria-label: GitHub
  page-footer:
    left: "eco is an exploratory project. The standard is a draft and may change between dataset versions; released versions do not ([releases and corrections](corrections.html))."
    right: "Built with [Quarto](https://quarto.org). Data on [Redivis](https://redivis.com/datasets/4j5q)."

format:
  html:
    theme:
      - cosmo
      - custom.scss
    toc: true
    toc-depth: 3
    code-fold: true
    link-external-newwindow: true
    # Favicon PNGs, touch icon and manifest beyond the one website.favicon emits.
    include-in-header: logos/_head.html

execute:
  echo: false
  message: false
  warning: false
  error: false
