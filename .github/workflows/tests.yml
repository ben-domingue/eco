# The gate on every change (issue #4): is every table in output/ still a valid
# eco table, does the validator still pass its own tests, and does every core
# table have its companions (side tables, __dataset.json, dictionary, tags and
# metadata rows)? A PR that edits a data/ script or an output/ file shows
# green or red from the validator here. Before this file, "did this change
# break a table" was a question only a human with a clone could answer.
#
# Deliberately offline: no Redivis, no deposit downloads, no GBIF, no
# credentials. A job that depends on a third party's uptime teaches people to
# ignore red marks. The rebuild from source (Rscript data/run_all.R) is
# network-bound and lives in rebuild.yml, on demand only.
#
# Borrowed from irw/src/.github/workflows/tests.yml, cut to eco's size.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Python: the validator over the corpus, its unit tests, and the companion
  # check. About a minute.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pytest
          # Installing the package is also what checks its pyproject still
          # builds; the gate itself runs from the repo root without it.
          python -m pip install -e eco_validate

      # pyproject.toml and __init__.py must agree before a tag ever tests them.
      - name: Package version is consistent
        run: python .github/scripts/check_eco_validate_version.py ""

      # The gate. Exit 1 on a blocking finding fails the job; the human-readable
      # report is in the log and the JSON (every affected case) is an artifact.
      - name: eco-validate output/
        run: python -m eco_validate.cli output/

      - name: eco-validate output/ --json
        if: always()
        run: python -m eco_validate.cli output/ --json > eco-validate.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eco-validate-report
          path: eco-validate.json

      # Includes the corpus test: every table under output/ passes, so a change
      # to a check that breaks a shipped table fails here and not on Redivis.
      - name: Validator tests
        run: python -m pytest eco_validate/tests -q

      # Every output/<t>.csv has __taxa.csv, __dataset.json, a dictionary row, a
      # tags row and a metadata.csv row (IRW's 17_coverage.R, at PR time).
      - name: Every table has its companions
        run: python tools/check_coverage.py --quiet

      # A count in a title, description, abstract, designNote or design tag
      # that is within 20% of, but not equal to, the computed n_units, n_traps,
      # n_periods or n_taxa ("48 cameras" over 46 units) fails (#28). Judged
      # exceptions live in EXEMPT in the script, each with its reason.
      - name: Numbers in prose agree with computed metadata
        run: python tools/check_prose_numbers.py --strict

      # Every repository file a site page reads is in site.yml's paths:, so an
      # edit to it rebuilds the site (#27).
      - name: Site rebuild paths cover what the site reads
        run: python tools/check_site_paths.py

  # R: the data/ scripts, lib/eco_common.R and the converters still parse, and
  # the R package installs. Nothing is executed against data: the scripts
  # download deposits and the package tests read Redivis, both of which belong
  # in rebuild.yml. setup-r with the public RSPM serves binaries, so no compile.
  r-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Every R file parses
        run: |
          Rscript -e '
            files <- c(list.files("data", pattern = "\\.R$", full.names = TRUE),
                       list.files("lib", pattern = "\\.R$", full.names = TRUE),
                       list.files("converters", pattern = "\\.R$", full.names = TRUE),
                       list.files("metadata", pattern = "\\.R$", full.names = TRUE),
                       list.files("Rpkg/R", pattern = "\\.R$", full.names = TRUE))
            bad <- character()
            for (f in files) {
              r <- try(parse(f), silent = TRUE)
              if (inherits(r, "try-error")) { bad <- c(bad, f); cat("PARSE ERROR", f, "\n", r) }
            }
            cat(length(files), "files parsed,", length(bad), "failed\n")
            if (length(bad)) quit(status = 1)'

      - name: R package installs
        run: |
          Rscript -e 'install.packages(c("data.table", "jsonlite"))'
          R CMD INSTALL Rpkg
