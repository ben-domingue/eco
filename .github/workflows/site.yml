# Renders site/ with Quarto and publishes it to GitHub Pages at
# https://ben-domingue.github.io/eco/.
#
# Not on push: a render installs R, unmarked and friends and re-runs the
# vignettes, and a batch day pushes main many times. It runs once a night,
# and only if main has a commit since the last night's run (the `changed` job;
# a night with no commits costs a few seconds). Every page reads main as of that
# night, so there is no list of watched paths to keep in step with the pages.
#
# To publish now: Actions -> Publish site -> Run workflow, or
#     gh workflow run site.yml
#
# One-time setup in the repository settings: Pages -> Source -> GitHub Actions.
name: Publish site

on:
  schedule:
    - cron: "23 7 * * *"   # 07:23 UTC daily (late evening US Pacific)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Scheduled runs skip the render when nothing landed on main in the last
  # 25 hours (an hour of slack for a late-starting cron). Manual runs always render.
  changed:
    runs-on: ubuntu-latest
    outputs:
      render: ${{ steps.check.outputs.render }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || \
             [ -n "$(git log -1 --since='25 hours ago' --format=%H)" ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
          else
            echo "render=false" >> "$GITHUB_OUTPUT"
            echo "No commits on main in the last 25 hours; not rendering."
          fi

  build-deploy:
    needs: changed
    if: needs.changed.outputs.render == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The vignettes under site/vignettes/ fetch tables with the eco package
      # (installed from this checkout's Rpkg/) and fit them with unmarked, marked and lme4.
      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("knitr", "rmarkdown", "jsonlite", "data.table", "unmarked", "AICcmodavg", "ggplot2", "plotly", "marked", "R2ucare", "lme4"))'
          R CMD INSTALL Rpkg

      # prerender.R builds the eco_validate wheel the browser validator loads
      # (site/validate.qmd, #8) from this checkout, so the page runs main's checks.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
