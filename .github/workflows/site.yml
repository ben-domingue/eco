# Renders site/ with Quarto and publishes it to GitHub Pages at
# https://ben-domingue.github.io/eco/. Runs on every push to main that touches
# the site or the files it reads (tags, dictionary, validator report, output
# metadata, the standard), and on demand.
#
# Rule: every repository file a page under site/ reads must match a glob in
# `paths:` below, or edits to it leave the page stale (#27).
# tools/check_site_paths.py enforces this in CI (tests.yml).
#
# One-time setup in the repository settings: Pages -> Source -> GitHub Actions.
name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "Rpkg/**"
      - "standard.md"
      - "analysis/figures.json"
      - "metadata/**"
      - "releases/**"
      - "validate/report.csv"
      - "output/*__dataset.json"
      - "queue/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The vignettes under site/vignettes/ fetch tables with the eco package
      # (installed from this checkout's Rpkg/) and fit them with unmarked.
      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("knitr", "rmarkdown", "jsonlite", "data.table", "unmarked", "AICcmodavg", "ggplot2", "plotly"))'
          R CMD INSTALL Rpkg

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
